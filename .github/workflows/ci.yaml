name: CI

on:
  push:
  pull_request:

jobs:
  gerbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make gamepock-cart.zip
        working-directory: rom
      - uses: actions/upload-artifact@v4
        with:
          name: gamepock-cart
          path: rom/gamepock-cart.zip

  stls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
        working-directory: stl
      - run: python egpccart_stl.py
        working-directory: stl
      - uses: actions/upload-artifact@v4
        with:
          name: stl
          path: stl/*.stl

  release:
    runs-on: ubuntu-latest
    needs: [gerbers, stls] # Waits for ALL matrix jobs (or list separate jobs: [build-linux, build-win])
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - run: gh release create ${{ github.ref_name }} --generate-notes || true
      - run: gh release upload ${{ github.ref_name }} ./artifacts/*/* --clobber 
